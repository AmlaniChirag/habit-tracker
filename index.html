<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="A minimalist habit tracker — build streaks, stay consistent." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Habits" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Habit Tracker</title>
    <script>
      // Avoid theme flash on load
      try {
        var raw = localStorage.getItem('habit-tracker-data');
        var theme = 'dark';
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.settings && parsed.settings.theme) {
            theme = parsed.settings.theme;
          }
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
